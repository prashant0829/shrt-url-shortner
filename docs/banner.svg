<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">shrt: long URLs in, short links out</title>
  <desc id="banner-desc">A long URL goes through the shrt logo and comes out as a short link that redirects back to it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330" />
      <stop offset="0.55" stop-color="#15307a" />
      <stop offset="1" stop-color="#2456d6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6d95ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6d95ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l8 4-8 4z" fill="#cfe0ff" />
    </marker>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bg)" />
  <rect width="1200" height="260" rx="20" fill="url(#dots)" />
  <circle cx="600" cy="124" r="170" fill="url(#glow)" />

  <!-- long URL -->
  <text x="64" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9db8ff">LONG URL</text>
  <rect x="40" y="96" width="380" height="68" rx="34" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" />
  <text x="72" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#dbe6ff">https://example.com/blog/launch-week?…</text>

  <!-- arrow 1 -->
  <text x="482" y="116" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9db8ff">SHORTEN</text>
  <line x1="436" y1="130" x2="526" y2="130" stroke="#cfe0ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#arrow)" />

  <!-- logo (same mark as the app's favicon) -->
  <g transform="translate(536 60)">
    <rect width="128" height="128" rx="28" fill="#2456d6" />
    <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />
    <g transform="scale(2)">
      <path d="M26 38l12-12M23 33l-4 4a8 8 0 0011 11l4-4M41 31l4-4a8 8 0 00-11-11l-4 4" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  <text x="600" y="224" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#ffffff">shrt</text>

  <!-- arrow 2 -->
  <text x="718" y="116" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9db8ff">REDIRECT</text>
  <line x1="674" y1="130" x2="762" y2="130" stroke="#cfe0ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#arrow)" />

  <!-- short link -->
  <text x="804" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#9db8ff">SHORT LINK</text>
  <rect x="780" y="96" width="380" height="68" rx="34" fill="#ffffff" />
  <circle cx="816" cy="130" r="7" fill="#1b7f4b" />
  <text x="838" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#2456d6">short.example/aB3xY9k</text>
</svg>
