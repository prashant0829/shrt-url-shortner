worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  sendfile on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Reuse the caller's request id, or mint one, so a request can be followed through the logs.
  map $http_x_request_id $trace_id {
    default $http_x_request_id;
    ''      $request_id;
  }

  upstream api {
    least_conn;
    server api-1:8080;
    server api-2:8080;
    keepalive 64;
  }

  server {
    listen 80;

    # Prometheus scrapes the API containers directly; it must not be reachable from outside.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';

      proxy_set_header Host $host;
      # nginx is the outermost proxy, so it overwrites (never appends to) the client-supplied
      # header: a caller cannot fake their address to dodge per-IP rate limits.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $trace_id;

      # If one replica fails or restarts, retry the request on the other.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
